<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Reset Meet GH Password</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#E9EEEC;--surface:#fff;--ink:#10262B;--muted:#586C70;--line:#D3DDDB;--brand:#0F4C4F;--danger:#B93A2E;--good:#1E7F55}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.5 'DM Sans',sans-serif;display:grid;place-items:center;padding:20px}
.card{width:min(100%,430px);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px;display:grid;gap:14px}
h1{font:700 28px 'Bricolage Grotesque',sans-serif;margin:0}p{margin:0;color:var(--muted)}
label{display:grid;gap:6px;color:var(--muted);font-size:13px}
input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:#F2F6F5;font:inherit;color:var(--ink)}
button{padding:13px 16px;border:0;border-radius:12px;background:var(--brand);color:white;font:700 15px 'DM Sans',sans-serif}
#message{font-size:14px;color:var(--danger)}#message.good{color:var(--good)}
a{color:var(--brand)}
</style>
</head>
<body>
<main class="card">
<h1>Choose a new password</h1>
<p>Enter a new password for your Meet GH account. Use at least 8 characters.</p>
<form id="reset-form" style="display:grid;gap:12px">
<label>New password<input id="new-password" type="password" autocomplete="new-password" minlength="8" required></label>
<label>Confirm new password<input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required></label>
<button id="save" type="submit">Save new password</button>
</form>
<p id="message" role="status">Checking your recovery link…</p>
<p><a href="./">Return to Meet GH Admin</a></p>
</main>
<script src="../js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  const msg=document.getElementById('message'), form=document.getElementById('reset-form'), btn=document.getElementById('save');
  let client=null, ready=false;
  const C=window.AKOMA_CONFIG||{};
  if(!C.SUPABASE_URL||!C.SUPABASE_ANON_KEY){
    msg.textContent='Supabase is not configured. Check js/config.js in your deployed Akoma folder.'; return;
  }
  if(!window.supabase){msg.textContent='Could not load Supabase. Refresh this page and try again.';return;}
  client=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  client.auth.getSession().then(({data,error})=>{
    if(error||!data.session){msg.textContent='This recovery link is invalid or expired. Request another password-reset email.';return;}
    ready=true;msg.textContent='Recovery link verified. Choose your new password.';msg.className='good';
  }).catch(()=>{msg.textContent='Could not verify this recovery link. Request another one.';});
  form.addEventListener('submit',async e=>{
    e.preventDefault(); if(!ready)return;
    const p=document.getElementById('new-password').value, c=document.getElementById('confirm-password').value;
    if(p.length<8){msg.textContent='Use at least 8 characters.';return;}
    if(p!==c){msg.textContent='The passwords do not match.';return;}
    btn.disabled=true;btn.textContent='Saving…';
    const {error}=await client.auth.updateUser({password:p});
    if(error){msg.textContent=error.message;btn.disabled=false;btn.textContent='Save new password';return;}
    msg.textContent='Password updated successfully. You can now sign in to Akoma Admin.';msg.className='good';
    form.hidden=true;
  });
})();
</script>
</body>
</html>
